<!DOCTYPE html>
<html lang="it">
<head>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/logo-512.png"><link rel="apple-touch-icon" href="icons/logo-512.png"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-title" content="Study">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Direction: bianco e nero come il PayPal di oggi, numeri grandi e liste pulite come Trade Republic. Il blu è solo un accento. Telefono = barra a pillola con icone circolari, PC = colonna laterale. */
:root{
  --bg:#FFFFFF; --ink:#0A0A0B; --muted:#6C6C72; --line:#E9E9EC;
  --surface:#F4F4F6; --surface2:#E9E9ED; --surface-solid:#FFFFFF;
  --accent:#0B5FFF; --accent2:#0B5FFF; --accent-ink:#FFFFFF; --accent-soft:rgba(11,95,255,.1);
  --pri:#0A0A0B; --pri-ink:#FFFFFF;
  --ok:#0C7A47; --ok-soft:rgba(18,160,92,.13); --warn:#8F5B00; --warn-soft:rgba(224,150,0,.16); --bad:#CF3024; --bad-soft:rgba(224,60,45,.12);
  --btn:var(--surface2); --field:var(--surface); --track:#E4E4E8; --shadow:0 8px 30px rgba(10,10,11,.14);
  --glass:transparent; --glass-strong:var(--bg); --glass-line:var(--line);
  --fd:'Jost','Futura','Century Gothic','Avenir Next',system-ui,sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#F5F5F7; --muted:#8E8E95; --line:#222225;
    --surface:#111113; --surface2:#1D1D20; --surface-solid:#161618;
    --accent:#5B96FF; --accent2:#5B96FF; --accent-ink:#000; --accent-soft:rgba(91,150,255,.16);
    --pri:#F5F5F7; --pri-ink:#000000;
    --ok:#2FD67B; --ok-soft:rgba(47,214,123,.15); --warn:#F2B24A; --warn-soft:rgba(242,178,74,.15); --bad:#FF6259; --bad-soft:rgba(255,98,89,.15);
    --track:#26262A; --shadow:0 8px 30px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#F5F5F7; --muted:#8E8E95; --line:#222225;
  --surface:#111113; --surface2:#1D1D20; --surface-solid:#161618;
  --accent:#5B96FF; --accent2:#5B96FF; --accent-ink:#000; --accent-soft:rgba(91,150,255,.16);
  --pri:#F5F5F7; --pri-ink:#000000;
  --ok:#2FD67B; --ok-soft:rgba(47,214,123,.15); --warn:#F2B24A; --warn-soft:rgba(242,178,74,.15); --bad:#FF6259; --bad-soft:rgba(255,98,89,.15);
  --track:#26262A; --shadow:0 8px 30px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;min-height:100%;color:var(--ink);font:400 14.5px/1.4 var(--fb);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.08} h2{font-size:18px;line-height:1.2} h3{font-size:17px;line-height:1.2}
small,.muted{color:var(--muted)} small{font-size:12.5px}
.num,.big,.time,.dh,.q{font-family:var(--fd);font-variant-numeric:tabular-nums lining-nums}
.num{font-weight:600;font-size:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{max-width:760px;margin:0 auto}
#top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px 6px}
#top p{margin:2px 0 0;color:var(--muted);font-size:13px}
#top:empty{padding:0}
#view{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
#banner:not(:empty){margin:0 16px 6px;padding:10px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}

/* superfici: piatte, senza bordi */
.card{background:var(--surface);border-radius:22px;padding:14px 16px}
.card>h2+*{margin-top:8px}
.card.plain,.plain{background:none!important;border:0!important;box-shadow:none!important;padding-left:0;padding-right:0}
.tile{background:none;padding:2px 0}
.tile small{display:block}.tile .big{margin-top:2px}

/* navigazione */
nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:3px;border-radius:99px;padding:6px;width:max-content;max-width:calc(100% - 20px);background:var(--surface-solid);box-shadow:var(--shadow);border:1px solid var(--line)}
nav button{position:relative;flex:none;width:clamp(44px,13.8vw,60px);height:clamp(48px,13.8vw,60px);display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;color:var(--muted);cursor:pointer;border-radius:50%;font-weight:500;transition:background .18s,color .18s}
nav button .lbl{display:none}
nav button::after{content:attr(aria-label);position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:99px;white-space:nowrap;opacity:0;pointer-events:none}nav button.tip::after{opacity:1}nav button.tip{color:var(--ink)}
nav button svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--pri-ink);background:var(--pri)}
.navfoot{display:none}
.mosaic{display:none}

/* righe e testi */
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.lrow{border-bottom:1px solid var(--line)}.lrow:last-child{border:0}
.lmain{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 0;cursor:pointer}
.time{display:flex;flex-direction:column;min-width:46px;font-weight:600;font-size:17px;line-height:1.1}
.time small{font-family:var(--fb);font-weight:400;font-size:12px}
.lt{flex:1;min-width:0}.lt b{display:block;font-weight:600;overflow-wrap:anywhere}.lt small{display:block}
.lrow.X .lt b{text-decoration:line-through;color:var(--muted)}
.lact{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px 58px}
.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px;font-weight:600;font-size:16px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}.kv b{color:var(--ink);font-weight:600}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.big{font-size:38px;line-height:1;font-weight:600;letter-spacing:-.02em}
.tile .big{font-size:30px}
.help{margin:0 2px;font-size:13px}
.empty{text-align:center;padding:24px 14px;color:var(--muted)}.empty h2{color:var(--ink);margin-bottom:6px;font-size:22px}
.ex{cursor:pointer;display:block;width:100%;text-align:left;border:0;color:inherit;transition:transform .15s}
.chart{width:100%;height:auto;display:block}

/* bottoni a pillola */
.btn{border:0;background:var(--btn);border-radius:99px;padding:7px 15px;cursor:pointer;font-weight:500;min-height:36px;transition:background .15s,transform .12s,opacity .15s}
@media(hover:hover){html:not(.touch) .btn:hover{background:var(--surface2);}}
.btn.pri{background:var(--pri);color:var(--pri-ink);font-weight:600}@media(hover:hover){html:not(.touch) .btn.pri:hover{filter:none;opacity:.88;background:var(--pri)}}
.btn.bad{color:var(--bad)}.btn.sm{min-height:30px;padding:3px 12px;font-size:13px}
.btn.armed{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.pdot2{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:1px}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:var(--surface);padding:7px 15px;border-radius:99px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}

/* barre */
.bar{position:relative;height:4px;border-radius:99px;background:var(--track);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ink)}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}

/* suggerimenti */
.sug{display:flex;gap:10px;padding:2px 0 2px 12px;border-left:2px solid var(--ink)}
.sug.bad{border-left-color:var(--bad)}.sug.warn{border-left-color:var(--warn)}.sug.ok{border-left-color:var(--ok)}
.sug b{display:block;font-family:var(--fd);font-weight:600;font-size:16px;line-height:1.2}.sug p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sug .btn{margin-top:6px}

/* campi */
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{border:0;background:var(--field);border-radius:14px;padding:8px 13px;color:var(--ink);width:100%;min-height:40px}
textarea{resize:vertical;line-height:1.4}
select,select.inp,.fld select{background-color:#101012!important;color:#F5F5F7!important;color-scheme:dark;border-radius:99px!important;padding-left:15px!important}
select option,select optgroup{background-color:#101012;color:#F5F5F7}
input[list]{color-scheme:dark}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;min-height:30px}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.sw{position:relative;flex:none;width:46px;height:28px;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:background .18s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw input:checked+span{background:var(--pri)}
.sw input:checked+span::after{transform:translateX(18px);background:var(--pri-ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* finestre */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
@media(min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:28px}}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);padding:10px 16px;border-radius:99px;font-size:13.5px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* grafici */
.hbar{display:grid;grid-template-columns:minmax(110px,44%) 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.hbar .t{line-height:1.2;overflow-wrap:anywhere}.hbar .num{text-align:right}
.wd{display:flex;gap:6px;align-items:flex-end;height:70px}.wd div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11.5px;color:var(--muted)}
.wd i,.vbars i{display:block;width:100%;background:var(--ink);border-radius:6px 6px 0 0;min-height:2px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:90px}
.vbars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11.5px;color:var(--muted);text-align:center}
.vbars div.cur i{background:var(--accent)}
.vbars div small{white-space:nowrap;overflow:visible}
@media(max-width:480px){.vbars{gap:3px}.vbars div{font-size:10.5px}.vbars div:nth-child(odd) small{visibility:hidden}}
.vbars b{font-family:var(--fd);font-size:15px;color:var(--ink)}
.flash{border-radius:22px;padding:22px 16px;text-align:center;background:var(--surface)}
.flash .q{font-weight:600;font-size:24px;line-height:1.2;margin:8px 0 14px}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.cal i{width:13px;height:13px;border-radius:50%;background:var(--track);display:block}
.cal i.p{background:var(--ok)}.cal i.a{background:var(--bad)}.cal i.f{background:transparent;border:1.5px solid var(--line)}.cal i.n{background:var(--accent);opacity:.45}.cal i.x{opacity:.25}
.ins{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}.ins:last-child{border:0}
.ins svg{flex:none;width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.kpi{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.kpi b{font-family:var(--fd);font-weight:600;font-size:64px;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:16px}
.delta{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.delta.ok{color:var(--ok)}.delta.bad{color:var(--bad)}.delta.neu{color:var(--muted)}
.prog{margin:8px 0 2px}
.now{box-shadow:inset 4px 0 0 var(--accent)}
.now .big{font-family:var(--fd);font-size:26px;font-weight:600;line-height:1.12;letter-spacing:-.01em;overflow-wrap:anywhere}
.eyebrow{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;font-weight:600;color:var(--accent)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.stats3 small{display:block}.stats3 .num{font-size:21px;display:block;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.num.long{font-size:15px!important;overflow-wrap:anywhere}.big.long{font-size:20px!important;overflow-wrap:anywhere;line-height:1.15}.stp{flex:1;height:3px;border-radius:9px;background:var(--track)}.stp.ok{background:var(--ink)}.stp.cur{background:var(--accent)}
.list{padding:2px 16px}
.crow2{padding:10px 0;border-bottom:1px solid var(--line)}.crow2:last-child{border:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:0 0 7px;cursor:pointer}
.cn{min-width:0}.cn b{display:block;font-family:var(--fd);font-size:17px;line-height:1.15;font-weight:600}.cn small{display:block;margin-top:2px}
.cp{display:flex;flex-direction:row-reverse;align-items:center;gap:8px;flex:none}.cp .num{font-size:22px;line-height:1}
.cdet{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.cfubox{display:flex;align-items:flex-end;gap:10px}.cfubox .fld{flex:1}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border:0}
.mrow.off .mt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.mt{flex:1;min-width:0}.mt b{display:block;font-weight:600;overflow-wrap:anywhere}.mt small{display:block}
.plan{margin-top:3px;color:var(--ink)}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0 4px;font-size:12.5px}

/* calendario */
.cbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cbar h2{font-size:22px;text-transform:capitalize}
.cbar .row{gap:4px}
.ibtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(hover:hover){html:not(.touch) .ibtn:hover{background:var(--surface2)}}.ibtn:disabled{opacity:.3;cursor:default}.ibtn:disabled:hover{background:var(--surface)}
.mtab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.mtab>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.mtab .wh{text-align:center;font-size:11.5px;color:var(--muted);padding:7px 0;font-weight:500;text-transform:uppercase;letter-spacing:.05em;background:var(--surface)}
.mtab>.mc{border-top:0;border-left:0;background:none;padding:4px 3px 5px;cursor:pointer;min-height:86px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;color:var(--ink);font:inherit;transition:background .12s}
@media(hover:hover){html:not(.touch) .mc:hover{background:var(--surface)}}
.mc.vac{background:var(--ok-soft)}.mc.ses{background:var(--warn-soft)}
.mc.ex .n{box-shadow:inset 0 0 0 2px var(--accent)}.mc.ex.today .n{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.mc.sel{background:var(--accent-soft)}
.mc .pn{display:none;font-size:10px;line-height:1.2;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:1px solid var(--line)}.pr:last-child{border:0}
.pr .pdot{flex:none;width:10px;height:10px;border-radius:50%}
.mc.out{opacity:.38}
.mc .n{align-self:flex-start;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--fd);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.mc.today .n{background:var(--accent);color:var(--accent-ink);font-weight:600}
.mc .ch{display:block;font-size:10px;line-height:1.3;padding:1px 4px;border-radius:5px;background:var(--surface2);border-left:2px solid var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .ch.e{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.mc .ch.a{border-left-color:var(--bad)}
.mc .ch.t{background:transparent;border-left:2px dashed var(--muted);color:var(--muted)}
.mc .more{font-size:10px;color:var(--muted);padding-left:4px}
@media(max-width:559px){.mtab>.mc{min-height:68px;gap:3px}.mc .ch{font-size:0;height:5px;padding:0;border-radius:3px;border-left:0;background:var(--ink);opacity:.5}.mc .ch.e{background:var(--accent);opacity:1}.mc .ch.a{background:var(--bad);opacity:1}.mc .ch.t{background:transparent;border:1.5px dashed var(--muted);height:5px;opacity:1}.mc .more{font-size:9.5px;padding-left:2px}}
@media(min-width:560px){.mc .ch{font-size:11px}.mtab>.mc{min-height:104px}.mc .pn{display:block}}
.ring{width:100%;max-width:380px;margin:0 auto;display:block;height:auto;overflow:visible}
.ring .mb{cursor:pointer;transition:opacity .15s}@media(hover:hover){html:not(.touch) .ring .mb:hover{opacity:.65}}
.ring text.ml{font-size:10.5px;cursor:pointer}.ring text.ml.cur{fill:var(--ink);font-weight:600}
.dlink{border:0;background:none;text-align:left;color:inherit;cursor:pointer;font:inherit;padding:0}
.ring text{font-family:var(--fd);fill:var(--muted)}
.ring .big-n{font-size:50px;font-weight:600;fill:var(--ink);letter-spacing:-.02em}
.ev{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev .time{min-width:46px}

const DEF={soglia:75,moduli:'uniti',nonSegnate:'presenti',cfuTotali:180,obiettivo:0,calUrl:'',escludi:'',soglie:{},inCorso:true,estero:false,provaMax:8,cfuVotoTot:0,nick:{},nickM:{},merge:{},mergeInit:false,mergeVer:0,annoImm:2025,seedDone:false,seedVer:0,welcomed:false,escl:[],plans:[],materieInit:false,drive:[]};

/* ====================== calendario ICS ====================== */
const unfold=t=>{const o=[];for(const r of t.split(/\r\n|\n|\r/)){if((r[0]===' '||r[0]==='\t')&&o.length)o[o.length-1]+=r.slice(1);else o.push(r);}return o;};
function splitProp(line){
  let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"')q=!q;
    else if(c===':'&&!q){
      const parts=line.slice(0,i).split(';'),params={};
      for(const p of parts.slice(1)){const k=p.indexOf('=');if(k>0)params[p.slice(0,k).toUpperCase()]=p.slice(k+1).replace(/^"|"$/g,'');}
      return{name:parts[0].toUpperCase(),params,value:line.slice(i+1)};
    }
  }
  return null;
}
const unesc=s=>s.replace(/\\([nN,;\\])/g,(m,c)=>/[nN]/.test(c)?' ':c).replace(/\s+/g,' ').trim();
function parseDT(v,p){
  v=v.trim();
  if(p.VALUE==='DATE'||/^\d{8}$/.test(v))return{n:Date.UTC(+v.slice(0,4),+v.slice(4,6)-1,+v.slice(6,8)),all:true};
  const m=/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z?)$/.exec(v);
  if(!m)throw new Error('dt');
  const[,Y,Mo,D,h,mi,,z]=m;
  const toN=r=>Date.UTC(+r.year,+r.month-1,+r.day,+r.hour,+r.minute);
  if(z)return{n:toN(tzParts(Date.UTC(+Y,+Mo-1,+D,+h,+mi),TZ)),all:false};
  if(p.TZID&&p.TZID!==TZ){try{return{n:toN(tzParts(wallToMs(+Y,+Mo,+D,+h,+mi,p.TZID),TZ)),all:false};}catch(e){}}
  return{n:Date.UTC(+Y,+Mo-1,+D,+h,+mi),all:false};
}
function durMs(s){const m=/^P(?:(\d+)W)?(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/.exec(s.trim());if(!m)return 36e5;const[,w,d,h,mi,sc]=m.map(x=>+x||0);return((w*7+d)*24*60+h*60+mi)*6e4+sc*1e3;}
const wdOf=n=>(new Date(n).getUTCDay()+6)%7;
const MAPD={MO:0,TU:1,WE:2,TH:3,FR:4,SA:5,SU:6};
function expand(start,rule){
  const R={};rule.split(';').forEach(p=>{const k=p.indexOf('=');if(k>0)R[p.slice(0,k).toUpperCase()]=p.slice(k+1);});
  const f=(R.FREQ||'').toUpperCase();
  if(f!=='DAILY'&&f!=='WEEKLY')return{out:[start],ok:false};
  const iv=Math.max(1,+R.INTERVAL||1),cnt=R.COUNT?+R.COUNT:null,lim=start+400*DAY;
  let until=null;
  if(R.UNTIL){const u=parseDT(R.UNTIL,{});until=u.all?u.n+DAY-1000:u.n;}
  const ok=s=>(until===null||s<=until)&&s<=lim,out=[];
  if(f==='DAILY'){for(let s=start;ok(s)&&(cnt===null||out.length<cnt);s+=iv*DAY)out.push(s);return{out,ok:true};}
  const days=R.BYDAY?R.BYDAY.split(',').map(x=>MAPD[x.replace(/[^A-Z]/g,'')]).filter(x=>x!==undefined).sort((a,b)=>a-b):[wdOf(start)];
  const mon=start-wdOf(start)*DAY;
  for(let k=0;;k++){
    const base=mon+k*iv*7*DAY;if(base>lim)break;
    for(const g of days){const s=base+g*DAY;if(s<start)continue;if(!ok(s)||(cnt!==null&&out.length>=cnt))return{out,ok:true};out.push(s);}
  }
  return{out,ok:true};
}
function parseICS(text){
  const vs=[];let cur=null,alarm=false;
  for(const line of unfold(text)){
    const u=line.trim().toUpperCase();
    if(u==='BEGIN:VEVENT'){cur={EX:[]};alarm=false;continue;}
    if(u==='END:VEVENT'){if(cur)vs.push(cur);cur=null;continue;}
    if(!cur)continue;
    if(u==='BEGIN:VALARM'){alarm=true;continue;}
    if(u==='END:VALARM'){alarm=false;continue;}
    if(alarm)continue;
    const p=splitProp(line);if(!p)continue;
    if(p.name==='EXDATE')cur.EX.push(p);else cur[p.name]=p;
  }
  const warn={},bump=k=>{warn[k]=(warn[k]||0)+1;},repl={};
  const uidOf=e=>(e.UID&&e.UID.value)||'';
  for(const e of vs)if(e['RECURRENCE-ID']){try{const d=parseDT(e['RECURRENCE-ID'].value,e['RECURRENCE-ID'].params);(repl[uidOf(e)]=repl[uidOf(e)]||new Set()).add(d.n);}catch(x){}}
  const out=[];
  for(const e of vs){
    if(!e.DTSTART)continue;
    if(((e.STATUS&&e.STATUS.value)||'').toUpperCase()==='CANCELLED'){bump('annullati nel calendario');continue;}
    let s,end;
    try{
      s=parseDT(e.DTSTART.value,e.DTSTART.params);
      if(s.all){bump('eventi di un giorno intero (ignorati)');continue;}
      end=e.DTEND?parseDT(e.DTEND.value,e.DTEND.params).n:e.DURATION?s.n+durMs(e.DURATION.value):s.n+36e5;
    }catch(x){bump('eventi illeggibili (ignorati)');continue;}
    const dur=end-s.n;if(dur<=0)continue;
    const title=unesc((e.SUMMARY&&e.SUMMARY.value)||'')||'(senza titolo)',aula=unesc((e.LOCATION&&e.LOCATION.value)||'');
    let starts=[s.n];
    if(e.RRULE){const r=expand(s.n,e.RRULE.value);starts=r.out;if(!r.ok)bump('ricorrenze non supportate (contata solo la prima)');}
    const ex=new Set(repl[uidOf(e)]||[]);
    for(const x of e.EX)for(const v of x.value.split(','))try{ex.add(parseDT(v,x.params).n);}catch(y){}
    const doc=unesc((e.DESCRIPTION&&e.DESCRIPTION.value)||'').slice(0,90);
    for(const st of starts)if(!ex.has(st))out.push({title,aula,doc,s:st,e:st+dur});
  }
  return{events:out,warn};
}
function hash(s){let h=5381,g=52711;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;g=((g<<5)^g^s.charCodeAt(i))|0;}return(h>>>0).toString(36)+(g>>>0).toString(36);}
function toLessons(events,opt){
  const words=(opt.escludi||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  const out=[];
  for(const ev of events){
    if(words.some(w=>ev.title.toLowerCase().includes(w)))continue;
    const iso=new Date(ev.s).toISOString(),d=iso.slice(0,10);
    if((opt.da&&d<opt.da)||(opt.a&&d>opt.a))continue;
    const s=iso.slice(11,16),e=new Date(ev.e).toISOString().slice(11,16);
    if(hm(e)<=hm(s))continue;
    out.push(lessonObj({d,s,e,t:ev.title,a:ev.aula}));
  }
  return out;
}

function pretty(s){
  let t=String(s||'').toLowerCase().replace(/([aeiou])'(?=\s|$|[^a-z])/g,(m,v)=>({a:'à',e:'è',i:'ì',o:'ò',u:'ù'}[v]));
  t=t.replace(/\s+/g,' ').trim();
  t=t.replace(/(^|[-:]\s)([a-zà-ù])/g,(m,a,b)=>a+b.toUpperCase());
  return t.replace(/\batp\b/g,'ATP');
}
const insegn=t=>String(t).split(' - ')[0].split(':')[0].trim();
const own=t=>pretty(insegn(t));
const subj=t=>{const o=own(t),m=S.cfg&&S.cfg.merge&&S.cfg.merge[normT(o)];return m||o;};
const modulo0=t=>{const p=String(t).split(' - ');const rest=p.length>1?p.slice(1).join(' - '):'';const q=(p.length>1?rest:p[0]).split(':');return p.length>1?rest:(q.length>1?q.slice(1).join(':').trim():'');};
function sede(a){
  const x=(a||'').toLowerCase();
  if(!x)return 'Altra sede';
  if(/ponte milvio|\bpm\d|snd|sna/.test(x))return 'Ponte Milvio';

  if(/olimpico/.test(x))return 'Stadio Olimpico';

}
const modulo=t=>{const o=own(t);if(subj(t)!==o){const m=modulo0(t);return m?o+' · '+m:o;}return modulo0(t);};
const SEED_DATA={T:[],R:''};

function derive(c,soglia){
  c.soglia=soglia;
  c.perc=c.oreSv?100*(c.oreSv-c.oreAss)/c.oreSv:null;
  const ass=c.oreAss+c.oreAssF;
  c.finale=c.oreTot?100*(c.oreTot-ass)/c.oreTot:null;
  c.margH=c.margL=null;c.stato='nd';c.max=null;
  if(!soglia||!c.oreTot)return;
  const max=c.oreTot*(1-soglia/100),m=Math.round((max-ass)*1e6)/1e6,avg=c.oreTot/c.lezTot;
  c.max=max;c.margH=m;
  c.margL=m>=0?Math.floor(m/avg+1e-9):-Math.ceil(-m/avg-1e-9);
  c.stato=m<0?'sforato':c.margL===0?'limite':(max>0&&ass/max>=.66)?'attenzione':'ok';
}
function attendance(){
  const per={},now=T.date+' '+T.time;
  for(const l of S.lez){
    const st=S.seg[l.u]||'';if(st==='X')continue;
    const k=ckey(l.c),h=(hm(l.e)-hm(l.s))/60;
    const c=per[k]||(per[k]={corso:k,lezTot:0,oreTot:0,lezSv:0,oreSv:0,lezAss:0,oreAss:0,lezAssF:0,oreAssF:0,nonSeg:0});

    if(l.d+' '+l.e<=now){

      else if(st==='P'){c.lezSv++;c.oreSv+=h;}
      else{c.nonSeg++;if(S.cfg.nonSegnate==='presenti'){c.lezSv++;c.oreSv+=h;}}

  const list=Object.values(per).sort((a,b)=>a.corso.localeCompare(b.corso,'it'));
  list.forEach(c=>derive(c,sogliaOf(c.corso)));

  ['lezTot','oreTot','lezSv','oreSv','lezAss','oreAss','lezAssF','oreAssF','nonSeg'].forEach(k=>tot[k]=list.reduce((s,c)=>s+c[k],0));

function career(){
  const ok=exList().filter(e=>e.stato==='superato');
  const cfu=ok.reduce((s,e)=>s+(+e.cfu||0),0);
  const ve=e=>e.lode?31:e.voto;
  const vot=ok.filter(e=>!e.idoneo&&e.voto);
  const cv=vot.reduce((s,e)=>s+(+e.cfu||0),0);
  const media=vot.length?vot.reduce((s,e)=>s+ve(e),0)/vot.length:null;
  const sw=vot.reduce((s,e)=>s+ve(e)*(+e.cfu||0),0);
  const pond=cv?sw/cv:null;
  const pending=exList().filter(e=>e.stato!=='superato'&&!e.idoneo);
  const cp=pending.reduce((s,e)=>s+(+e.cfu||0),0);
  let need=null;
  if(S.cfg.obiettivo&&cp>0){need=(S.cfg.obiettivo*(cv+cp)-sw)/cp;}
  const run=[];let sv=0,sc=0;
  vot.slice().sort((a,b)=>(a.dataEsito||'').localeCompare(b.dataEsito||'')).forEach(e=>{sv+=ve(e)*(+e.cfu||0);sc+=(+e.cfu||0);if(sc)run.push(sv/sc);});
  return{ok,cfu,vot,media,pond,sw,cv,base:pond?pond*110/30:null,pending,cp,need,run};
}

const rnd=x=>Math.floor(x+0.5);
function laureaCalc(){
  const C=career(),c=S.cfg,prova=Math.max(0,+c.provaMax||8);
  const bonus=(c.inCorso?3:0)+(c.estero?1:0);
  const minPond=extra=>{const A=110-extra-prova;return{A,pond:(A-0.5)*30/110};};
  const sc=[['Senza bonus',0],['Laurea in corso (+3)',3],['In corso e 12 CFU all\'estero (+4)',4]].map(([l,b])=>({l,b,...minPond(b)}));
  const sel=minPond(bonus);
  const adm=C.base==null?null:rnd(C.base);
  const maxNow=adm==null?null:adm+bonus+prova;
  let rem=null,remCfu=0;
  remCfu=(+c.cfuVotoTot||0)>0?Math.max(0,(+c.cfuVotoTot)-C.cv):C.cp;
  if(remCfu>0)rem=(sel.pond*(C.cv+remCfu)-C.sw)/remCfu;
  return{C,bonus,prova,sc,sel,adm,maxNow,rem,remCfu};
}
function minVoti(L){
  L=L||laureaCalc();const C=L.C;
  if(L.remCfu<=0)return[];
  const M=L.sel.pond,tot=C.cv+L.remCfu;
  return C.pending.filter(e=>+e.cfu>0).map(e=>{
    const c=+e.cfu,x=(M*tot-C.sw-31*(L.remCfu-c))/c,m=Math.ceil(x-1e-9);
    return{e,c,exact:x,min:Math.max(18,m),free:x<=18,imp:m>31};
  }).sort((a,b)=>b.c-a.c);
}

function spark(v){

function weekKey(d){return addDays(d,-wd(d));}
function heatmap(){
  if(!S.lez.length)return '';
  const now=T.date+' '+T.time,by={};
  S.lez.forEach(l=>{(by[l.d]=by[l.d]||[]).push(l);});
  const first=weekKey(S.lez[0].d),last=weekKey(S.lez[S.lez.length-1].d);
  let h='';
  for(let w=first;w<=last;w=addDays(w,7))for(let k=0;k<5;k++){
    const d=addDays(w,k),ls=(by[d]||[]).filter(l=>(S.seg[l.u]||'')!=='X');
    let c='x',t=fD(d);
    if(ls.length){
      const past=ls.every(l=>l.d+' '+l.e<=now);
      if(!past&&!ls.some(l=>S.seg[l.u]==='A'))c='f';
      else if(ls.some(l=>S.seg[l.u]==='A')){c='a';t+=': assenza';}
      else if(ls.every(l=>S.seg[l.u]==='P')||S.cfg.nonSegnate==='presenti'){c='p';t+=': presente';}
      else c='n';
    }
    h+=`<i class="${c}" title="${esc(t)}"></i>`;
  }
  return h;
}
function weeklyHours(){

}
function sedeHours(){

}
function insights(){

    }

  if(S.lez.length){
    const hd=Array(7).fill(0);const seen=new Set();
    S.lez.forEach(l=>{if((S.seg[l.u]||'')==='X')return;hd[wd(l.d)]+=(hm(l.e)-hm(l.s))/60;seen.add(weekKey(l.d)+'|'+wd(l.d));});

    if(nx)out.push(['oggi',`Nei prossimi 14 giorni hai ${hrs(nx)} di lezione.`]);
  }
  return out;
}

function sheet(o){
  const root=$('#sheet-root');
  closeSheet();
  const wrap=document.createElement('div');
  wrap.className='sheet-back';wrap.id='sheet';
  wrap.innerHTML=`<form class="sheet" novalidate><h2>${esc(o.title)}</h2>${o.intro?`<p class="muted" style="margin:0">${o.intro}</p>`:''}${(o.fields||[]).map(fld).join('')}${o.html||''}<div class="row sp"><button type="button" class="btn" data-a="sheet-close">Annulla</button>${o.submit?`<button type="button" class="btn pri" data-a="sheet-ok">${esc(o.submit)}</button>`:''}</div></form>`;
  root.appendChild(wrap);
  const f=wrap.querySelector('form');
  const go=()=>{
    if(!wrap.isConnected)return;
    try{
      const v={};
      for(const x of o.fields||[]){const el=f.elements[x.k];v[x.k]=x.t==='check'?el.checked:el.value;}
      if(o.onSubmit&&o.onSubmit(v)===false)return;
      closeSheet();
    }catch(err){console.error(err);toast('Non sono riuscito a salvare: '+((err&&err.message)||'errore'));}
  };
  wrap._go=go;
  f.addEventListener('submit',ev=>{ev.preventDefault();go();});
  f.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.type!=='checkbox'){ev.preventDefault();go();}});
  wrap.addEventListener('mousedown',ev=>{if(ev.target===wrap)closeSheet();});
  const first=f.querySelector('input:not([type=checkbox]),select,textarea');if(first&&!o.noFocus)first.focus();
}

/* ====================== libretto incollato ====================== */
function heuristicLibretto(txt){
  const out=[];
  for(const line of txt.split(/\n+/)){
    const tk=line.split(/\t+| {2,}/).map(x=>x.trim()).filter(Boolean);
    const name=tk.find(x=>/[a-zà-ù]{4,}/i.test(x));if(!name)continue;
    const nums=tk.filter(x=>/^\d{1,2}$/.test(x)).map(Number);
    const vt=tk.slice().reverse().find(x=>/^(1[89]|2\d|30)(\s*(e\s*)?l(ode)?)?$/i.test(x));
    const ido=tk.some(x=>/^(idoneo|ido|approvato|superato)$/i.test(x));
    const cf=nums.find(n=>n>=2&&n<=15&&n!==(vt?parseInt(vt):-1));
    const dt=tk.find(x=>/^\d{2}\/\d{2}\/\d{4}$/.test(x));
    if(!vt&&!ido&&!cf)continue;
    out.push({nome:name,cfu:cf||null,voto:vt?parseInt(vt):null,lode:!!vt&&/l/i.test(vt),idoneita:ido&&!vt,data:dt?dt.split('/').reverse().join('-'):null,superato:!!(vt||ido)});
  }
  return out;
}
async function readLibretto(txt){
  let rows=null,sm=null;
  try{sm=window.claude&&await window.claude.use('sample');}catch(e){}
  toast('Leggo il libretto…');
  if(sm){
    try{
      rows=await sm.json("Il testo seguente è stato copiato dal libretto di uno studente universitario italiano (Esse3). Estrai gli insegnamenti. Rispondi SOLO con un array JSON di oggetti {\"nome\":string,\"cfu\":number|null,\"voto\":number|null,\"lode\":boolean,\"idoneita\":boolean,\"data\":\"YYYY-MM-DD\"|null,\"superato\":boolean}. Il voto è tra 18 e 30; per le idoneità senza voto usa idoneita:true e voto:null; superato è true solo se risulta sostenuto. Non inventare dati: se un valore manca usa null. Testo:\n\n"+txt.slice(0,60000),{modelTier:'default'});
    }catch(e){rows=null;}
  }
  if(!Array.isArray(rows))rows=heuristicLibretto(txt);
  rows=rows.filter(r=>r&&r.nome&&String(r.nome).length>2);
  if(!rows.length){toast('Non ho riconosciuto esami: controlla il testo incollato');return;}
  sheet({title:'Controlla gli esami',intro:'Deseleziona ciò che non va. Gli esami già presenti nell\'app vengono aggiornati.',
    fields:rows.map((r,i)=>({k:'r'+i,t:'check',v:true,l:`${pretty(r.nome)}${r.cfu?' · '+r.cfu+' CFU':''}${r.superato?(r.idoneita?' · idoneo':' · '+r.voto+(r.lode?' e lode':'')):' · da sostenere'}`})),submit:'Salva esami',
    onSubmit:v=>{
      let n=0;
      rows.forEach((r,i)=>{
        if(!v['r'+i])return;
        const name=pretty(r.nome),k=normT(name);
        let e=exList().find(x=>normT(x.corso)===k)||exList().find(x=>{const y=normT(x.corso);return y.length>8&&(k.includes(y)||y.includes(k));});
        if(!e){e={id:rid(),corso:name,cfu:0,stato:'da_fare',appelli:[],argomenti:[],domande:[],note:[]};S.exams[e.id]=e;}
        if(r.cfu)e.cfu=+r.cfu;
        if(r.superato){e.stato='superato';e.idoneo=!!r.idoneita;e.voto=r.idoneita?null:(+r.voto||null);e.lode=!!r.lode&&e.voto===30;e.dataEsito=r.data||e.dataEsito||T.date;}
        saveEx(e);n++;
      });
      S.tab='esami';S.esub='tutti';S.exId=null;render();toast(`${pl(n,'esame salvato','esami salvati')}`);
    }});
}
/* ====================== applicazione lezioni ====================== */
const normT=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function applyLessons(les,o){
  const by=new Map(S.allLez.map(l=>[l.u,l]));
  const slot=new Map();
  S.allLez.forEach(l=>{const k=l.d+'|'+l.s+'|'+l.e+'|'+normT(l.c).slice(0,14);slot.set(k,l);});
  let nuove=0;const keep=new Set();
  for(const l of les){
    const old=slot.get(l.d+'|'+l.s+'|'+l.e+'|'+normT(l.c).slice(0,14));
    if(old&&old.u!==l.u){l.u=old.u;}
    keep.add(l.u);
    const ex=by.get(l.u);
    if(!ex)nuove++;
    by.set(l.u,{...(ex||{}),...l,t:l.t||(ex&&ex.t)||''});
  }
  let rim=0;
  if(o.sync)for(const [u,l] of [...by]){if(!keep.has(u)&&!S.seg[u]&&(!o.da||l.d>=o.da)&&(!o.a||l.d<=o.a)){by.delete(u);rim++;}}
  S.lez=[...by.values()].sort((a,b)=>(a.d+a.s).localeCompare(b.d+b.s));
  const esami=autoExams();
  persist('lez',50);persist('cfg');
  return{nuove,rim,esami};
}
function autoExams(){
  const have=new Set(Object.values(S.exams).filter(Boolean).map(e=>normT(e.corso)));
  
  let n=0;
  for(const k of [...new Set(S.lez.map(l=>subj(l.c)))]){
    if(/a scelta/i.test(k)||have.has(normT(k)))continue;
    const e={id:rid(),corso:k,cfu:0,stato:'da_fare',appelli:[],argomenti:[],domande:[],note:[],auto:true};
    S.exams[e.id]=e;persist('ex-'+e.id,80);n++;
  }
  return n;
}

function ensureMerge(){
  if(S.mode!=='db'||(S.cfg.mergeVer||0)>=2)return;
  const first=!S.cfg.mergeInit;
  S.cfg.mergeVer=2;S.cfg.mergeInit=true;
  S.cfg.merge={...(S.cfg.merge||{})};
  if(first&&!S.cfg.merge[normT('Attrezzistica')])S.cfg.merge[normT('Attrezzistica')]='Sport individuali';
  if(!S.cfg.merge[normT('Ritmica')])S.cfg.merge[normT('Ritmica')]='Sport individuali';
  persist('cfg',200);
}
function ensureSeed(){
  if(S.mode!=='db'||!S.cfg.seedDone||(S.cfg.seedVer||0)>=2)return;
  S.cfg.seedVer=2;
  const r=applyLessons(seedLessons().map(lessonObj),{sync:false});
  setTimeout(()=>toast(`Ho aggiunto il resto dell'anno: ${pl(r.nuove,'lezione','lezioni')}${r.esami?` e ${pl(r.esami,'materia nuova','materie nuove')}`:''}`),600);
}
function ensureMaterie(){
  ensureMerge();
  ensureSeed();
  if(S.cfg.materieInit||S.mode!=='db')return;
  S.cfg.materieInit=true;
  const k=normT('Ulteriori conoscenze linguistiche');
  if(!(S.cfg.escl||[]).includes(k))S.cfg.escl=[...(S.cfg.escl||[]),k];
  persist('cfg',200);
}
function materie(){
  const m={};
  const get=(name)=>{const key=subj(name);const id=normT(key);return m[id]||(m[id]={id,name:key,n:0,h:0,cfu:0,exam:null,plans:[],mods:[]});};
  S.allLez.forEach(l=>{const x=get(l.c);if(modulo(l.c)&&!x.mods.includes(pretty(l.c)))x.mods.push(pretty(l.c));x.n++;x.h+=(hm(l.e)-hm(l.s))/60;});
  Object.values(S.exams).filter(Boolean).forEach(e=>{const x=get(e.corso);x.exam=e;x.cfu=+e.cfu||0;});
  (S.cfg.plans||[]).forEach(p=>{get(p.nome).plans.push(p);});
  return Object.values(m).map(x=>({...x,on:!(S.cfg.escl||[]).includes(x.id)})).sort((a,b)=>a.name.localeCompare(b.name,'it'));
}
function genPlan(p){
  const out=[];
  for(let d=p.dal;d<=p.al&&out.length<400;d=addDays(d,1)){
    if(!p.giorni.includes(wd(d)))continue;
    out.push({u:'p'+hash(p.id+'|'+d+'|'+p.s),d,s:p.s,e:p.e,c:p.nome,a:p.aula||'',t:'',plan:p.id});
  }
  return out;
}
function savePlan(p,cfu){
  S.cfg.plans=(S.cfg.plans||[]).filter(x=>x.id!==p.id).concat([p]);
  S.allLez=S.allLez.filter(l=>l.plan!==p.id).concat(genPlan(p)).sort((a,b)=>(a.d+a.s).localeCompare(b.d+b.s));
  const k=normT(subj(p.nome));
  if(S.cfg.escl.includes(k))S.cfg.escl=S.cfg.escl.filter(x=>x!==k);
  if(!Object.values(S.exams).filter(Boolean).some(e=>normT(subj(e.corso))===k)){
    const e={id:rid(),corso:subj(p.nome),cfu:+cfu||0,stato:'da_fare',appelli:[],argomenti:[],domande:[],note:[]};
    S.exams[e.id]=e;saveEx(e);
  }
  persist('lez',80);persist('cfg');
}
function planSheet(p,nome){
  const n=!p;
  p=p||{id:rid(),nome:nome||'',giorni:[0],s:'10:00',e:'12:00',aula:'',dal:T.date,al:(S.allLez.length?S.allLez[S.allLez.length-1].d:addDays(T.date,98))};
  const ex=Object.values(S.exams).filter(Boolean).find(e=>normT(subj(e.corso))===normT(subj(p.nome)));
  const dayFields=GG.slice(0,6).map((g,i)=>({k:'g'+i,t:'check',l:g[0].toUpperCase()+g.slice(1),v:p.giorni.includes(i)}));
  sheet({title:n?'Nuova materia':'Orario di '+p.nome,intro:'Le lezioni vengono create ogni settimana nei giorni scelti, tra le due date.',
    fields:[{k:'nome',l:'Nome della materia',req:1,v:p.nome,list:'dl-corsi'},{k:'cfu',l:'CFU',t:'number',min:0,max:30,v:ex?ex.cfu||'':''},...dayFields,{k:'s',l:'Dalle',t:'time',v:p.s},{k:'e',l:'Alle',t:'time',v:p.e},{k:'aula',l:'Aula o sede',v:p.aula},{k:'dal',l:'Da quando',t:'date',v:p.dal},{k:'al',l:'Fino a quando',t:'date',v:p.al}],
    submit:'Salva',
    onSubmit:v=>{
      const giorni=[0,1,2,3,4,5].filter(i=>v['g'+i]);
      if(!v.nome.trim()||!giorni.length||!v.s||!v.e||v.e<=v.s||!v.dal||!v.al||v.al<v.dal){toast('Servono nome, almeno un giorno, orari e date validi');return false;}
      const np={id:p.id,nome:v.nome.trim(),giorni,s:v.s,e:v.e,aula:v.aula.trim(),dal:v.dal,al:v.al};
      savePlan(np,v.cfu);render();toast(`${pl(genPlan(np).length,'lezione pianificata','lezioni pianificate')}`);
    }});
}
V.materie=()=>{
  const ms=materie(),on=ms.filter(m=>m.on),off=ms.filter(m=>!m.on);
  const row=m=>`<div class="mrow ${m.on?'':'off'}"><div class="mt"><b>${esc(nm(m.name))}</b>${nm(m.name)!==m.name?`<small>${esc(m.name)}</small>`:''}<small>${[m.n?pl(m.n,'lezione','lezioni'):'',m.cfu?m.cfu+' CFU':''].filter(Boolean).join(' · ')||'Nessuna lezione'}</small>${m.mods.map(f=>{const nk=(S.cfg.nickM||{})[normT(f)];return `<small class="plan">Modulo: ${esc(modulo(f))}${nk?` → <b>${esc(nk)}</b>`:''} <button class="lnk" data-a="mod-nick" data-n="${esc(f)}">${nk?'Cambia':'Soprannome'}</button>${subj(f)!==own(f)?` <button class="lnk" data-a="mat-sep" data-n="${esc(own(f))}">Separa</button>`:''}</small>`;}).join('')}<small class="plan"><button class="lnk" data-a="mat-merge" data-n="${esc(m.name)}">Unisci a un'altra materia</button> <button class="lnk" data-a="mat-nick" data-n="${esc(m.name)}">${nm(m.name)!==m.name?'Cambia soprannome':'Dai un soprannome'}</button></small>${m.plans.length?m.plans.map(p=>`<small class="plan">${p.giorni.map(i=>GGs[i]).join(', ')} ${p.s}-${p.e}${p.aula?' · '+esc(p.aula):''} <button class="lnk" data-a="plan-edit" data-id="${p.id}">Modifica</button> <button class="lnk" data-a="plan-del" data-id="${p.id}" data-arm="1">Elimina</button></small>`).join(''):''}</div><label class="sw" aria-label="${m.on?'Segui':'Non seguire'} ${esc(m.name)}"><input type="checkbox" data-in="mat" data-k="${m.id}" ${m.on?'checked':''}><span></span></label></div>`;
  return `<p class="muted help">Scegli le materie che segui. Quelle disattivate spariscono da calendario, presenze, esami e analisi, ma restano qui e puoi riattivarle quando vuoi.</p>
  <section class="card"><div class="row sp"><h2>Materie che segui</h2><span class="pill acc">${on.length}</span></div>${on.length?on.map(row).join(''):'<p class="muted">Nessuna materia attiva.</p>'}</section>
  ${off.length?`<section class="card"><div class="row sp"><h2>Non le segui</h2><span class="pill">${off.length}</span></div>${off.map(row).join('')}</section>`:''}
  <button class="btn pri" data-a="plan-new">+ Aggiungi una materia con il suo orario</button>`;
};

$('#file-ics').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  let r;
  try{r=parseICS(await f.text());}catch(e){toast('File non leggibile');return;}
  if(!r.events.length){toast('Nessuna lezione trovata nel file');return;}
  S.pending=r;
  const ds=r.events.map(e=>new Date(e.s).toISOString().slice(0,10)).sort(),cs=new Set(r.events.map(e=>e.title));
  const w=Object.entries(r.warn).map(([k,v])=>`${v} ${k}`).join('; ');
  sheet({title:'Importa calendario',intro:`${pl(r.events.length,'evento','eventi')} in ${pl(cs.size,'insegnamento','insegnamenti')}, dal ${fD(ds[0])} al ${fD(ds[ds.length-1])}.${w?' Note: '+esc(w)+'.':''}`,
    fields:[{k:'da',l:'Importa dal (facoltativo)',t:'date'},{k:'a',l:'Fino al (facoltativo)',t:'date'},{k:'esc',l:'Escludi titoli che contengono',v:S.cfg.escludi,ph:'ricevimento, laurea'},{k:'sync',l:'Rimuovi le lezioni non segnate che non sono più nel calendario',t:'check',v:true}],submit:'Importa',
    onSubmit:v=>{
      S.cfg.escludi=v.esc;
      const les=toLessons(r.events,{da:v.da,a:v.a,escludi:v.esc});
      if(!les.length){toast('Con questi filtri non resta nessuna lezione');return false;}
      const res=applyLessons(les,{sync:v.sync,da:v.da,a:v.a});
      S.pending=null;S.tab='lezioni';S.lsub='presenze';render();
      toast(`${pl(res.nuove,'lezione nuova','lezioni nuove')}${res.rim?`, ${res.rim} rimosse`:''}${res.esami?`, ${pl(res.esami,'esame aggiunto','esami aggiunti')}`:''}`);
    }});
});

(function(){
  const _sp=A['st-pick'];
  A['st-pick']=function(el){const r=el.closest('.chips'),sl=r?r.scrollLeft:0;_sp(el);const n=document.querySelector('[data-a="st-pick"]');if(n&&n.parentElement)n.parentElement.scrollLeft=sl;};
  let cur=null,sx=0,sy=0,prev=null,t0=0,lastId='';
  const sel='.chip[data-a="st-pick"]';
  function paint(el){const row=el.parentElement;prev=[...row.querySelectorAll(sel)].map(c=>[c,c.getAttribute('aria-pressed')]);prev.forEach(([c])=>c.setAttribute('aria-pressed',c===el?'true':'false'));}
  let pt=0;function undo(){clearTimeout(pt);if(prev)prev.forEach(([c,v])=>c.setAttribute('aria-pressed',v));prev=null;cur=null;}
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest(sel);if(!el)return;
    cur=el;sx=e.clientX;sy=e.clientY;
  },{passive:true});
  document.addEventListener('pointermove',e=>{if(cur&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))undo();},{passive:true});
  document.addEventListener('pointercancel',()=>{if(cur)undo();});
  document.addEventListener('pointerup',e=>{
    if(!cur)return;clearTimeout(pt);const el=cur;cur=null;prev=null;
    if(!inBox(el,e))return;
    let tg=el;if(!tg.isConnected){tg=document.querySelector('.chip[data-a="st-pick"][data-id="'+el.dataset.id+'"]');if(!tg)return;}
    paint(tg);t0=Date.now();lastId=tg.dataset.id;A['st-pick'](tg);
  });
  window.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest(sel);
    if(el&&Date.now()-t0<700&&el.dataset.id===lastId){e.stopPropagation();e.preventDefault();}
  },true);
})();
(function(){
  let cur=null,sx=0,sy=0,t0=0,lastK='';
  const sel='[data-a][aria-pressed]:not(.chip)';
  const keyOf=el=>el.dataset.a+'|'+el.textContent+'|'+(el.dataset.v||el.dataset.id||'');
  document.addEventListener('pointerdown',e=>{cur=null;if(e.pointerType==='mouse'||e.button>0)return;const el=e.target.closest&&e.target.closest(sel);if(el&&!el.disabled){cur=el;sx=e.clientX;sy=e.clientY;}},{passive:true});
  document.addEventListener('pointermove',e=>{if(cur&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))cur=null;},{passive:true});
  document.addEventListener('pointercancel',()=>{cur=null;});
  document.addEventListener('pointerup',e=>{
    const el=cur;cur=null;if(!el||!el.isConnected||!inBox(el,e)||el.getAttribute('aria-pressed')==='true')return;
    [...el.parentNode.children].forEach(x=>{if(x.hasAttribute('aria-pressed'))x.setAttribute('aria-pressed',x===el?'true':'false');});
    t0=Date.now();lastK=keyOf(el);
    el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
  });
  window.addEventListener('click',e=>{{const q=e.isTrusted&&Date.now()-t0<700&&e.target.closest&&e.target.closest(sel);if(q&&keyOf(q)===lastK){e.stopPropagation();e.preventDefault();}}},true);
})();
document.addEventListener('pointerdown',e=>{document.documentElement.classList.toggle('touch',e.pointerType!=='mouse');},{capture:true,passive:true});

(function(){
